name: Windows build

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
    paths:
      - "main.cpp"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "build.bat"
      - "README.md"
      - "textures/**"
      - "update.bat"
      - "update.ps1"
      - ".gitignore"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.cpp"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "build.bat"
      - "README.md"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

concurrency:
  group: minicraft3d-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-glm
      - name: Test gameplay systems
        shell: msys2 {0}
        run: |
          g++ tests/gameplay_tests.cpp src/gameplay/gameplay.cpp -o gameplay-tests.exe -std=c++17 -Wall -Wextra
          ./gameplay-tests.exe
      - name: Test infinite chunk world
        shell: msys2 {0}
        run: |
          g++ tests/world_tests.cpp -o world-tests.exe -std=c++17 -Wall -Wextra
          ./world-tests.exe
      - name: Test texture atlas
        shell: msys2 {0}
        run: |
          g++ tests/atlas_tests.cpp -o atlas-tests.exe -std=c++17 -Wall -Wextra
          ./atlas-tests.exe
      - name: Compile game
        shell: msys2 {0}
        run: g++ main.cpp src/gameplay/gameplay.cpp -o MiniCraft3D.exe -std=c++17 -O2 -Wall -Wextra -lglfw3 -lglew32 -lopengl32 -lgdi32 -luser32 -lshell32
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MiniCraft3D-28.0-Windows
          path: MiniCraft3D.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MiniCraft3D.exe
            textures/atlas.ppm
          generate_release_notes: true
